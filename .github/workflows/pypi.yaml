
name: Publish package

on:
    workflow_dispatch:
    release:
        types: [published]

permissions:
  contents: read

jobs:
    pypi_publish:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
          id-token: write
          contents: write 
        steps:
        - uses: actions/checkout@master

        - name: Setup Python
          uses: actions/setup-python@v3
          with:
            python-version: '3.10'

        - name: Install UV
          uses: astral-sh/setup-uv@v7
          with:
            activate-environment: true

        - name: Install packages
          run: |
            uv pip install build twine wheel pdm pdm-backend polib six
            uv pip install --no-deps git+https://github.com/psychopy/psychopy.git@release  # just for the version number
        
        - name: Build
          run: |
            # build with no-build-isolation to avoid installing build dependencies (slow on linux)
            uv build --no-build-isolation --wheel --sdist
                
        - name: Attach binaries
          if: startsWith(github.ref, 'refs/tags/')
          uses: softprops/action-gh-release@v2
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
            files: |
              dist/*
        
        - name: Upload to PyPi
          if: startsWith(github.ref, 'refs/tags/')
          uses: pypa/gh-action-pypi-publish@release/v1

        - name: Upload to GH Artifacts
          if: always()
          uses: actions/upload-artifact@v4
          with:
            path: |
              dist/*